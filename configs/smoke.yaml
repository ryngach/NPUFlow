# CPU smoke test of the whole pipeline: two tiny stages on local Sintel/KITTI.
batch_size: 4
num_workers: 2
log_interval: 5
val_interval: 10
val_limit: 3
stages:
  - name: stage1
    train: [sintel-clean]
    val: [[sintel-clean, val], [kitti15, val]]
    steps: 20
    lr_max: 4.0e-4
    lr_min: 4.0e-5
  - name: stage2
    train: [sintel-final, kitti15]
    val: [[sintel-final, val]]
    steps: 10
    lr_max: 2.0e-4
    lr_min: 2.0e-5
    encoder_lr_factor: 0.1
